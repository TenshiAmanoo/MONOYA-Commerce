<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <g transform="translate(10, 10)">
    <!-- Red Badge Rounded Container -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#CE1823" />
    
    <!-- White Stitched Dashed Inner Line -->
    <rect x="7" y="7" width="86" height="86" rx="16" fill="none" stroke="#FAF6F2" stroke-width="2.5" stroke-dasharray="4.2 3.8" stroke-linecap="round" />
    
    <!-- Center Circular Ivory Disc -->
    <circle cx="50" cy="50" r="28" fill="#FAF6F2" />
    
    <!-- Centered Red Medical/Archive Cross -->
    <!-- Vertical bar -->
    <rect x="46.5" y="32" width="7" height="36" rx="1.8" fill="#CE1823" />
    <!-- Horizontal bar -->
    <rect x="32" y="46.5" width="36" height="7" rx="1.8" fill="#CE1823" />
  </g>
</svg>
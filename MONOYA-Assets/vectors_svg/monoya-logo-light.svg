<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&amp;family=Inter:wght@500;600;700&amp;family=Noto+Serif+JP:wght@600;700;900&amp;display=swap');
      .monoya-title {
        font-family: 'Cinzel', 'Playfair Display', 'Georgia', 'Times New Roman', serif;
        font-weight: 800;
        font-size: 37px;
        letter-spacing: 0.16em;
        fill: #1C3B44;
      }
      .monoya-sub-jp {
        font-family: 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
        font-weight: 700;
        font-size: 15.5px;
        letter-spacing: 0.08em;
        fill: #5A8C8E;
      }
      .monoya-dot {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #5A8C8E;
      }
      .monoya-sub-en {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 14.5px;
        letter-spacing: 0.19em;
        fill: #5A8C8E;
      }
    </style>
  </defs>
  
  
  <g transform="translate(18, 16)">
    <!-- Red Badge Rounded Container (88x88) -->
    <rect x="0" y="0" width="88" height="88" rx="20" fill="#CE1823" />
    
    <!-- White Stitched Dashed Inner Line -->
    <rect x="6.5" y="6.5" width="75" height="75" rx="14.5" fill="none" stroke="#FAF6F2" stroke-width="2.4" stroke-dasharray="3.8 3.4" stroke-linecap="round" />
    
    <!-- Center Circular Ivory Disc -->
    <circle cx="44" cy="44" r="24" fill="#FAF6F2" />
    
    <!-- Centered Cross -->
    <!-- Vertical bar -->
    <rect x="41" y="28" width="6" height="32" rx="1.6" fill="#CE1823" />
    <!-- Horizontal bar -->
    <rect x="28" y="41" width="32" height="6" rx="1.6" fill="#CE1823" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(132, 60)">
    <!-- MONOYA Wordmark -->
    <text x="0" y="0" class="monoya-title">MONOYA</text>
    
    <!-- Subtitle: 物屋 ・ JAPAN ARCHIVE DIRECT -->
    <text x="1" y="27">
      <tspan class="monoya-sub-jp">物屋</tspan>
      <tspan class="monoya-dot" dx="8">・</tspan>
      <tspan class="monoya-sub-en" dx="8">JAPAN ARCHIVE DIRECT</tspan>
    </text>
  </g>
</svg>